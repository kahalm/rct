name: Build Android TWA (AAB+APK)

# Manuell ausgelöst: baut aus twa/twa-manifest.json ein signiertes AAB + APK und lädt
# beides als Workflow-Artefakt hoch (Muster aus RookHub, ohne Release-Publish — das wird
# nachgerüstet, sobald RCT v*-Tags nutzt).
#
# Benötigte Repository-Secrets:
#   ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_PASSWORD (Alias: rct)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install required Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      # Bubblewrap erkennt JDK/SDK nicht automatisch und fragt sonst interaktiv (Exit 130 in CI).
      - name: Configure Bubblewrap (use preinstalled JDK + SDK)
        run: |
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<CFG
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_SDK_ROOT}"
          }
          CFG

      - name: Restore signing keystore
        working-directory: twa
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android.keystore

      - name: Generate Android project from manifest
        working-directory: twa
        run: bubblewrap update --skipVersionUpgrade

      - name: Build signed AAB + APK
        working-directory: twa
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bubblewrap build --skipPwaValidation

      - name: Upload AAB + APK
        uses: actions/upload-artifact@v7
        with:
          name: rct-android
          path: |
            twa/app-release-bundle.aab
            twa/app-release-signed.apk
          if-no-files-found: error
