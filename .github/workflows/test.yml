name: Tests

on:
  workflow_call:
  pull_request:
    branches: [main]

jobs:
  # RCT hat (noch) kein Test-Projekt — das Gate ist vorerst Build-only.
  # Sobald tests/Rct.Api.Tests existiert: hier auf `dotnet test` umstellen.
  build-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/api/Rct.Api/Rct.Api.csproj -c Release

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/frontend/app/package-lock.json
      - run: npm ci
        working-directory: src/frontend/app
      - run: npx ng build --configuration=production
        working-directory: src/frontend/app
