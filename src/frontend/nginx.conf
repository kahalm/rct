# Cache-Politik je URI-Klasse (Muster aus RookHub): index/i18n/Assets revalidieren,
# hash-benannte Build-Artefakte 1 Jahr immutable. Als map, damit die server-weiten
# Security-Header nicht durch location-add_header verloren gehen.
map $uri $rct_cache_control {
    default "";
    ~^/(index\.html|favicon\.svg)$  "no-cache, must-revalidate";
    ~^/(i18n|board|piece)/  "no-cache, must-revalidate";
    "~^/(main|polyfills|chunk|styles|scripts)-[A-Za-z0-9_-]{6,}\.(js|mjs|css)$"  "public, max-age=31536000, immutable";
    ~^/media/  "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control $rct_cache_control always;

    # Security-Header
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com;" always;

    # RCT API
    location /api/ {
        # Upstream zur Laufzeit über Dockers internen DNS auflösen (Muster aus RookHub):
        # verhindert "[emerg] host not found in upstream api" beim (Re)Start.
        resolver 127.0.0.11 valid=30s;
        set $rct_api api:8080;
        proxy_pass http://$rct_api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA-Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
