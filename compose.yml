###############################################################################
# Real Chess Training (RCT) — db + api + frontend
#
#   docker compose --env-file .env up --build
###############################################################################

services:

  mariadb:
    image: mariadb:11
    container_name: rct-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD must be set}
      MARIADB_DATABASE: ${RCT_DB_NAME:-rct}
      MARIADB_USER: ${RCT_DB_USER:-rct}
      MARIADB_PASSWORD: ${RCT_DB_PASSWORD:?RCT_DB_PASSWORD must be set}
    volumes:
      - rct-db-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [rct]

  api:
    build:
      context: ./src/api/Rct.Api
      dockerfile: Dockerfile
    container_name: rct-api
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Server=mariadb;Port=3306;Database=${RCT_DB_NAME:-rct};User=${RCT_DB_USER:-rct};Password=${RCT_DB_PASSWORD};"
      Jwt__Key: ${JWT_KEY:?JWT_KEY must be set (>=32 bytes)}
      Jwt__Issuer: Rct
      Jwt__Audience: Rct
      # Admin-Seed beim Start (nur wenn Konto fehlt; 'change_me' wird verweigert).
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      # Passwort-Reset-Mails (leer = SMTP aus, Reset-Mails werden verworfen + geloggt)
      App__BaseUrl: ${APP_BASE_URL:-}
      Email__SmtpHost: ${EMAIL_SMTP_HOST:-}
      Email__SmtpPort: ${EMAIL_SMTP_PORT:-587}
      Email__SmtpUser: ${EMAIL_SMTP_USER:-}
      Email__SmtpPassword: ${EMAIL_SMTP_PASSWORD:-}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:-}
      Email__FromName: ${EMAIL_FROM_NAME:-Real Chess Training}
      Email__UseStartTls: ${EMAIL_USE_STARTTLS:-true}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
    ports:
      - "${API_EXTERNAL_PORT:-5080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [rct]

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: rct-frontend
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${FRONTEND_EXTERNAL_PORT:-8090}:8080"
    networks: [rct]

volumes:
  rct-db-data:

networks:
  rct:
